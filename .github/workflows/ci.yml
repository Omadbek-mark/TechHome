name: Backend CI
on:
  pull_request:
  push:
    branches: [develop, master, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: docker build -t techhome-backend:ci .
      - run: docker run --rm --entrypoint node techhome-backend:ci --check dist/server.js
